<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据公示 · 魔兽管家</title>
<!-- 静态资源版本号与 index.html 同步递增（开发规范第五章第 6 条）：20260807.20 -->
<link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/brand/favicon-16.png">
<link rel="stylesheet" href="css/main.css?v=20260807.20">
<link rel="stylesheet" href="css/data-public.css?v=20260807.20">
<script src="assets/vendor/supabase-js-2.js?v=20260807.20"></script>
<script src="js/iconMap.js?v=20260807.20"></script>
</head>
<body class="data-public-body">
  <!-- 任务书 #23 WP2：数据公示页（免登录公开，anon 直连 PostgREST，只读） -->
  <header class="dp-header">
    <div class="dp-brand">
      <img src="assets/brand/logo_B_64.png" alt="魔兽管家" class="dp-logo">
      <div>
        <div class="dp-title">数据公示</div>
        <div class="dp-subtitle">魔兽管家 WoW Butler · 团本 / 大秘境掉落池与套装一览</div>
      </div>
    </div>
    <div class="dp-season">
      <label for="dpSeasonSelect">赛季</label>
      <select id="dpSeasonSelect" class="form-select"></select>
    </div>
  </header>

  <!-- 筛选规范 v1.0 §2 唯一合法布局：四组各行 → 排除杂项行 → 搜索框独立行；§6 移动端折叠为「筛选 ▾」 -->
  <div class="dp-filterbar" id="dpFilterBar">
    <button id="dpFilterToggle" class="btn btn-secondary dp-filter-toggle">筛选 ▾</button>
    <div class="dp-chip-row"><span class="dp-chip-label">部位</span><span class="dp-chips" id="dpSlotChips"></span></div>
    <div class="dp-chip-row"><span class="dp-chip-label">类型</span><span class="dp-chips" id="dpTypeChips"></span></div>
    <!-- 任务书 #23-补丁 修正项③：主/副属性多标签筛选（AND） -->
    <div class="dp-chip-row"><span class="dp-chip-label">主属性</span><span class="dp-chips" id="dpPrimaryChips"></span></div>
    <div class="dp-chip-row"><span class="dp-chip-label">副属性</span><span class="dp-chips" id="dpSecondaryChips"></span></div>
    <!-- 任务书 #23-补丁3 修正项⑥：排除杂项开关（默认关）+ 问号说明（逐字文案按筛选规范 §5） -->
    <div class="dp-misc-row">
      <label class="dp-misc-toggle"><input type="checkbox" id="dpExcludeMisc">排除杂项物品
        <span class="dp-help" id="dpMiscHelp" tabindex="0">?
          <span class="dp-help-pop">勾选后仅显示装备，屏蔽坐骑、玩具、装饰、配方、幻化及垃圾等杂项物品</span>
        </span>
      </label>
    </div>
    <!-- REQ-084（任务书 #23-补丁6）：搜索框清除钮，复用 REQ-077 模式（uc-input-wrap/uc-clear-btn 主应用同款，main.css 已加载） -->
    <div class="dp-search-row"><div class="uc-input-wrap"><input type="text" id="dpSearch" class="search-input" placeholder="搜索装备名…"><button type="button" id="dpSearchClear" class="uc-clear-btn" aria-label="清除搜索" title="清空" style="display:none">&times;</button></div></div>
  </div>

  <main class="dp-main" id="dpMain">
    <div class="dp-loading">数据加载中…</div>
  </main>

  <footer class="dp-footer">数据来源：魔兽管家数据中心 · 只读公示，由运营维护</footer>

  <script src="js/dataPublic.js?v=20260807.20"></script>
</body>
</html>
