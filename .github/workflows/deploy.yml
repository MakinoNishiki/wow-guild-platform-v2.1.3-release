name: Deploy to production

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wow-production-deploy
  cancel-in-progress: false

jobs:
  deploy-cn:
    name: Deploy wow.ddctl.com (CN)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.CN_DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.CN_DEPLOY_HOST_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf 'wow-production-cn %s\n' "$DEPLOY_HOST_KEY" \
            > "$HOME/.ssh/known_hosts"

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.CN_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.CN_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.CN_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o HostKeyAlias=wow-production-cn \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST"
