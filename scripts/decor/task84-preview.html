<!doctype html><style>html,body{margin:0;width:512px;height:512px;overflow:hidden}</style><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script><script type="module">
import * as T from 'three';import {GLTFLoader} from './vendor/GLTFLoader.js';
const renderer=new T.WebGLRenderer({alpha:true,antialias:true,preserveDrawingBuffer:true});renderer.setSize(512,512);renderer.setPixelRatio(1);renderer.setClearColor(0,0);renderer.outputColorSpace=T.SRGBColorSpace;document.body.appendChild(renderer.domElement);
const scene=new T.Scene();scene.add(new T.HemisphereLight(0xffffff,0x777777,2));const light=new T.DirectionalLight(0xffffff,3);light.position.set(3,5,4);scene.add(light);
const camera=new T.PerspectiveCamera(35,1,.01,10000);
try {const gltf=await new GLTFLoader().loadAsync(new URL(location.href).searchParams.get('id')+'.glb');const materialInfo=await fetch(new URL(location.href).searchParams.get('id')+'.materials.json').then(r=>r.json());gltf.scene.traverse(o=>{if(o.isMesh){const association=gltf.parser.associations.get(o);const info=materialInfo[association?.meshes];if(new URL(location.href).searchParams.get('id')==='28559' && info?.material?.blendingMode===4)o.visible=false;if(info?.material?.blendingMode>=2 && o.geometry.index?.count<=6)o.visible=false;for(const m of (Array.isArray(o.material)?o.material:[o.material])){if(!m.map)o.visible=false;if(m.map){m.alphaTest=.5;m.side=T.DoubleSide;m.needsUpdate=true}}}});scene.add(gltf.scene);gltf.scene.updateMatrixWorld(true);const box=new T.Box3();const vertex=new T.Vector3();gltf.scene.traverse(o=>{if(o.isMesh&&o.visible){o.skeleton?.update();const index=o.geometry.index;const count=index?index.count:o.geometry.attributes.position.count;for(let i=0;i<count;i++){o.getVertexPosition(index?index.getX(i):i,vertex);box.expandByPoint(vertex.applyMatrix4(o.matrixWorld));}}});const center=box.getCenter(new T.Vector3());const radius=box.getBoundingSphere(new T.Sphere()).radius;camera.position.copy(center).add(new T.Vector3(1,.65,1.3).normalize().multiplyScalar(radius/Math.sin(T.MathUtils.degToRad(17.5))*1.15));camera.lookAt(center);camera.near=radius/100;camera.far=radius*100;camera.updateProjectionMatrix();renderer.render(scene,camera);window.result={bounds:box.min.toArray().concat(box.max.toArray()),triangles:renderer.info.render.triangles};window.done=true;}catch(e){window.error=String(e);window.done=true}
</script>
